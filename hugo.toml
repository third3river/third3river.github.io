baseURL = "https://third3river.github.io/"
locale  = "zh-cn"
defaultContentLanguage = "zh"
title = "third3river 的个人博客"
theme = "PaperMod"

hasCJKLanguage = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  author = "third3river"
  description = "记录学习、阅读与思考"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.homeInfoParams]
  Title = "你好"
  Content = "这里记录我的学习、阅读和思考。"

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 40
